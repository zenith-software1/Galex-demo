<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tienda — Galexx MX</title>
    <meta name="description" content="Tienda oficial Galexx MX. Gorras premium." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.bunny.net" crossorigin />
    <link href="https://fonts.bunny.net/css?family=outfit:700,800|dm-sans:400,500" rel="stylesheet" />
    <link rel="stylesheet" href="assets/galexx.css" />
    <link rel="stylesheet" href="assets/galexx-premium.css" />
    <link rel="stylesheet" href="assets/store.css" />
    <link rel="stylesheet" href="assets/mobile.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <div class="ambient__orb ambient__orb--1"></div>
      <div class="ambient__orb ambient__orb--2"></div>
    </div>

    <header class="nav is-scrolled">
      <div class="nav__inner">
        <a href="index.html" class="nav__brand">GALEXX<span>MX</span></a>
        <ul class="nav__links" id="navLinks">
          <li><a href="index.html#drops">Drops</a></li>
          <li><a href="index.html#lookbook">Lookbook</a></li>
          <li><a href="store.html">Tienda</a></li>
          <li class="nav__mobile-cta"><a href="store.html">Ver carrito</a></li>
        </ul>
        <a href="index.html" class="nav__cta nav__cta--desk" style="background:var(--glass);color:var(--text);border:1px solid var(--border)">Inicio</a>
        <button type="button" class="nav__burger" id="navBurger" aria-label="Menú" aria-expanded="false" aria-controls="navLinks">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </header>

    <main class="store-page">
      <section class="store-hero reveal is-visible">
        <p class="sec-label">Tienda oficial</p>
        <h1>Tu colección<br /><span>empieza aquí</span></h1>
        <p class="store-hero__sub">Agrega al carrito y paga por WhatsApp.</p>
      </section>

      <div class="wrap">
        <div id="products" class="store-grid"></div>
      </div>
    </main>

    <button type="button" id="cartBtn" class="cart-fab glass glass--shimmer" aria-label="Carrito">
      <span>Carrito</span>
      <span id="cartCount" class="cart-fab__count">0</span>
    </button>

    <script src="assets/galexx.js" defer></script>
    <script src="assets/store.js" defer></script>
  </body>
</html>
